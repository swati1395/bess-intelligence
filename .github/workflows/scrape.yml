name: Daily BESS Intelligence Pipeline

# When this workflow runs:
#  - On a daily schedule at 5 am, 9 am, and 1 pm PDT (cron is always UTC)
#  - On-demand via "Run workflow" button in the Actions tab (workflow_dispatch)
#
# Pipeline order: scrape → extract → email digest → rebuild dashboard → commit.
# Each Gmail step reads secrets from the repo's Actions secrets;
# names must match GitHub Secret names exactly (case-sensitive).
#
# Three runs per day: the extractor only processes unextracted articles, so the
# 9 am and 1 pm runs do almost nothing on healthy days — but catch up if Gemini
# was down at 5 am.
#
# UTC offsets (PDT / PST differ by 1h; adjust the cron if needed for winter):
#   5 am PDT = 12:00 UTC   9 am PDT = 16:00 UTC   1 pm PDT = 20:00 UTC
# Reference: https://crontab.guru/
on:
  schedule:
    - cron: '0 12 * * *'   # 5 am PDT
    - cron: '0 16 * * *'   # 9 am PDT
    - cron: '0 20 * * *'   # 1 pm PDT
  workflow_dispatch:

# Needs write access to commit the updated DB and dashboard back.
permissions:
  contents: write

# Prevent overlapping runs (e.g., manual trigger during a scheduled run).
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Safety net: the full pipeline normally finishes in 7-15 min. If any step
    # hangs (e.g. an unresponsive feed), kill the job at 20 min rather than
    # letting it run to GitHub's 6h ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser PyYAML certifi requests beautifulsoup4 litellm pydantic python-dotenv

      - name: Run RSS scraper
        run: python scraper/rss_scraper.py

      - name: Run company newsroom scrapers
        # Individual sites may be unreachable (Tesla Cloudflare, dead domains,
        # JS-only pages) — the script catches per-source exceptions and exits 0.
        run: python scraper/company_scraper.py

      - name: Extract structured intelligence (Gemini-only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python extractor/intel_extractor.py --prioritize-tags

      - name: Send daily digest email
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python alerts/email_digest.py --daily

      - name: Rebuild dashboard
        run: python dashboard/build.py

      - name: Commit updated database and dashboard
        run: |
          if git diff --quiet data/intel.db docs/index.html; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intel.db docs/index.html
          git commit -m "chore: refresh intel.db + dashboard ($(date -u +%Y-%m-%d))"
          # Race-proof: if main advanced during the run (manual push, overlapping
          # job), replay this commit on top before pushing rather than failing on
          # a rejected non-fast-forward. Working tree is clean here, so no stash.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
