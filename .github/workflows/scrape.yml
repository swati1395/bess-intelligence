name: Daily BESS Intelligence Pipeline

# When this workflow runs:
#  - On a daily schedule (cron in UTC — edit below to change)
#  - On-demand via "Run workflow" button in the Actions tab (workflow_dispatch)
#
# Pipeline order: scrape → extract → email digest → rebuild dashboard → commit.
# Each Claude API + Gmail step reads secrets from the repo's Actions secrets;
# names must match GitHub Secret names exactly (case-sensitive).
#
# Cron is always UTC on GitHub Actions. 12:00 UTC corresponds to:
#   - 8:00 am EDT / 7:00 am EST  (US Eastern)
#   - 7:00 am CDT / 6:00 am CST  (US Central)
#   - 5:00 am PDT / 4:00 am PST  (US Pacific)
# Pick your time and adjust the cron string. Reference: https://crontab.guru/
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

# Needs write access to commit the updated DB and dashboard back.
permissions:
  contents: write

# Prevent overlapping runs (e.g., manual trigger during a scheduled run).
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser PyYAML certifi requests beautifulsoup4 anthropic pydantic python-dotenv

      - name: Run RSS scraper
        run: python scraper/rss_scraper.py

      - name: Run company newsroom scrapers
        # Individual sites may be unreachable (Tesla Cloudflare, dead domains,
        # JS-only pages) — the script catches per-source exceptions and exits 0.
        run: python scraper/company_scraper.py

      - name: Diagnose ANTHROPIC_API_KEY (temporary — safe metadata only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -c "
          import os
          k = os.environ.get('ANTHROPIC_API_KEY', '')
          print(f'len={len(k)}')
          print(f'prefix={k[:15]!r}')
          print(f'suffix={k[-4:]!r}')
          print(f'has_trailing_newline={k.endswith(chr(10))}')
          print(f'has_trailing_whitespace={k != k.rstrip()}')
          print(f'has_internal_whitespace={any(c.isspace() for c in k.strip())}')"
          python3 -c "
          import anthropic
          try:
              r = anthropic.Anthropic().messages.create(model='claude-opus-4-7', max_tokens=10,
                  messages=[{'role':'user','content':'ping'}])
              print(f'API_PING: ok, {r.usage.input_tokens} in / {r.usage.output_tokens} out')
          except Exception as e:
              print(f'API_PING: FAIL — {type(e).__name__}: {e}')
              if e.__cause__:
                  print(f'  underlying: {type(e.__cause__).__name__}: {e.__cause__}')"

      - name: Extract structured intelligence (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python extractor/intel_extractor.py --prioritize-tags

      - name: Send daily digest email
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python alerts/email_digest.py --daily

      - name: Rebuild dashboard
        run: python dashboard/build.py

      - name: Commit updated database and dashboard
        run: |
          if git diff --quiet data/intel.db docs/index.html; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intel.db docs/index.html
          git commit -m "chore: refresh intel.db + dashboard ($(date -u +%Y-%m-%d))"
          git push
